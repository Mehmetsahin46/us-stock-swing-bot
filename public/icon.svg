<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="candleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10B981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Rounded Superellipse -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#1F2937" stroke-width="4" stroke-opacity="0.6" />

  <!-- Background Grid lines -->
  <line x1="80" y1="180" x2="432" y2="180" stroke="#1E293B" stroke-width="2" stroke-dasharray="6,6" opacity="0.4" />
  <line x1="80" y1="280" x2="432" y2="280" stroke="#1E293B" stroke-width="2" stroke-dasharray="6,6" opacity="0.4" />
  <line x1="80" y1="380" x2="432" y2="380" stroke="#1E293B" stroke-width="2" stroke-dasharray="6,6" opacity="0.4" />

  <!-- Candlesticks -->
  <!-- Candle 1 -->
  <line x1="140" y1="240" x2="140" y2="380" stroke="#10B981" stroke-width="4" stroke-linecap="round" />
  <rect x="124" y="270" width="32" height="80" rx="6" fill="url(#candleGrad)" opacity="0.85" />

  <!-- Candle 2 -->
  <line x1="210" y1="200" x2="210" y2="340" stroke="#10B981" stroke-width="4" stroke-linecap="round" />
  <rect x="194" y="230" width="32" height="70" rx="6" fill="url(#candleGrad)" opacity="0.85" />

  <!-- Candle 3 (Taller) -->
  <line x1="280" y1="150" x2="280" y2="300" stroke="#10B981" stroke-width="4" stroke-linecap="round" />
  <rect x="264" y="180" width="32" height="90" rx="6" fill="url(#candleGrad)" />

  <!-- Candle 4 (Peak) -->
  <line x1="350" y1="100" x2="350" y2="260" stroke="#34D399" stroke-width="4" stroke-linecap="round" />
  <rect x="334" y="130" width="32" height="100" rx="6" fill="url(#candleGrad)" />

  <!-- Dynamic Trend Curve (Neon Wave) -->
  <path d="M 90 380 Q 180 340, 230 260 T 370 140 T 440 90" fill="none" stroke="url(#glowGrad)" stroke-width="12" stroke-linecap="round" filter="url(#shadow)" />

  <!-- High-Tech Target Node -->
  <circle cx="440" cy="90" r="16" fill="#10B981" filter="url(#shadow)" />
  <circle cx="440" cy="90" r="8" fill="#FFFFFF" />

  <!-- Bottom Brand Text (SWING) -->
  <text x="256" y="445" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="8">SWING BOT</text>
</svg>